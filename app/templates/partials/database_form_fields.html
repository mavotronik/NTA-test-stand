{% if error %}<p class="modal-form-error">{{ error }}</p>{% endif %}
<div class="form-group"><label class="form-label">Имя</label><input class="input" name="name" required value="{{ profile.name if profile else '' }}"></div>
<div class="form-group"><label class="form-label">Host</label><input class="input" name="host" required value="{{ profile.host if profile else '127.0.0.1' }}"></div>
<div class="form-group"><label class="form-label">Port</label><input class="input" type="number" name="port" value="{{ profile.port if profile else 8123 }}"></div>
<div class="form-group"><label class="form-label">Database</label><input class="input" name="database_name" value="{{ profile.database_name if profile else 'default' }}"></div>
<div class="form-group"><label class="form-label">User</label><input class="input" name="username" required value="{{ profile.username if profile else 'default' }}"></div>
<div class="form-group"><label class="form-label">Password{% if profile %} (пусто — не менять){% endif %}</label><input class="input" type="password" name="password" {% if not profile %}required{% endif %} autocomplete="new-password"></div>
<div class="switch-row"><div>TLS</div><label class="switch"><input type="checkbox" name="tls" value="1" {% if profile and profile.tls %}checked{% endif %}><span class="slider"></span></label></div>
<div class="switch-row"><div>Writable (запись в БД)</div><label class="switch"><input type="checkbox" name="writable" value="1" {% if profile and profile.writable %}checked{% endif %}><span class="slider"></span></label></div>
<div class="form-group"><label class="form-label">Комментарий</label><input class="input" name="comment" value="{{ profile.comment if profile else '' }}"></div>
