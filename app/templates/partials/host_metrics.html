{% from "partials/host_metrics_overlay_fragments.html" import cpu_overlay, memory_overlay, load_overlay, disk_overlay %}
<section class="metrics">
  <div class="card metric metric-with-chart">
    <div class="metric-chart metric-chart--bg" aria-hidden="true">
      <canvas class="host-metric-chart-canvas" data-chart-role="card-bg" data-metric="cpu" data-history-hours="24" data-cpu-count="{{ cpu_count|default(1) }}"></canvas>
    </div>
    <div class="metric-overlay" id="host-metric-cpu-overlay">{{ cpu_overlay(metrics) }}</div>
    <a class="metric-chart-btn icon-button"
       href="/partials/host-metrics/chart-modal?metric=cpu"
       hx-get="/partials/host-metrics/chart-modal?metric=cpu"
       hx-target="#formModalInner"
       hx-swap="innerHTML"
       hx-push-url="false"
       title="График за 72 ч"><span class="mdi mdi-chart-line"></span></a>
  </div>
  <div class="card metric metric-with-chart">
    <div class="metric-chart metric-chart--bg" aria-hidden="true">
      <canvas class="host-metric-chart-canvas" data-chart-role="card-bg" data-metric="memory" data-history-hours="24" data-cpu-count="{{ cpu_count|default(1) }}"></canvas>
    </div>
    <div class="metric-overlay" id="host-metric-memory-overlay">{{ memory_overlay(metrics) }}</div>
    <a class="metric-chart-btn icon-button"
       href="/partials/host-metrics/chart-modal?metric=memory"
       hx-get="/partials/host-metrics/chart-modal?metric=memory"
       hx-target="#formModalInner"
       hx-swap="innerHTML"
       hx-push-url="false"
       title="График за 72 ч"><span class="mdi mdi-chart-line"></span></a>
  </div>
  <div class="card metric metric-with-chart">
    <div class="metric-chart metric-chart--bg" aria-hidden="true">
      <canvas class="host-metric-chart-canvas" data-chart-role="card-bg" data-metric="load" data-history-hours="24" data-cpu-count="{{ cpu_count|default(1) }}"></canvas>
    </div>
    <div class="metric-overlay" id="host-metric-load-overlay">{{ load_overlay(metrics) }}</div>
    <a class="metric-chart-btn icon-button"
       href="/partials/host-metrics/chart-modal?metric=load"
       hx-get="/partials/host-metrics/chart-modal?metric=load"
       hx-target="#formModalInner"
       hx-swap="innerHTML"
       hx-push-url="false"
       title="График за 72 ч"><span class="mdi mdi-chart-line"></span></a>
  </div>
  <div class="card metric{% if metrics.disks %} metric-with-chart{% endif %}" id="host-metric-disk-card">
    {% if metrics.disks %}
    <div class="metric-chart metric-chart--bg" aria-hidden="true">
      <canvas class="host-metric-chart-canvas" data-chart-role="card-bg" data-metric="disk" data-history-hours="24" data-cpu-count="{{ cpu_count|default(1) }}"></canvas>
    </div>
    <div class="metric-overlay" id="host-metric-disk-overlay">{{ disk_overlay(metrics) }}</div>
    <a class="metric-chart-btn icon-button"
       href="/partials/host-metrics/chart-modal?metric=disk"
       hx-get="/partials/host-metrics/chart-modal?metric=disk"
       hx-target="#formModalInner"
       hx-swap="innerHTML"
       hx-push-url="false"
       title="График за 72 ч"><span class="mdi mdi-chart-line"></span></a>
    {% else %}
    <div class="metric-top">
      <div class="metric-icon"><span class="mdi mdi-harddisk"></span></div>
    </div>
    <div class="metric-label">Disk</div>
    <div class="metric-value">—</div>
    {% endif %}
  </div>
</section>
