<div class="modal modal-log js-log-modal-dialog job-log-shell" role="dialog" aria-modal="true" aria-labelledby="jobLogTitle" data-tone="primary">
  <div class="modal-header">
    <div class="modal-icon" aria-hidden="true"><span class="mdi mdi-text-box-outline"></span></div>
    <div class="modal-header-grow">
      <h2 class="modal-title" id="jobLogTitle">{{ job_type_labels.get(job.job_type, job.job_type) }} · {{ job.status }} · {{ job.stage }}</h2>
      {% include "partials/job_log_autoscroll_toggle.html" %}
    </div>
    <button type="button" class="icon-button modal-close" data-close-modal aria-label="Закрыть"><span class="mdi mdi-close"></span></button>
  </div>
  <div class="modal-body modal-body-log">
    <pre class="job-log-pre"
         hx-get="/deployments/{{ job.id }}/logs"
         hx-trigger="load, every 2s [document.visibilityState=='visible']"
         hx-swap="beforeend"
         hx-vals="js:{after_id: jobLogPollVals().after_id}">{% include "partials/job_log_lines.html" %}</pre>
  </div>
</div>
