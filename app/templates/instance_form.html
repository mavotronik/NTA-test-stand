{% extends "base.html" %}
{% block title %}Новый инстанс{% endblock %}
{% block content %}
<div class="page-header"><div><h1 class="page-title">Создание инстанса</h1></div></div>
<div class="card" style="max-width:640px;">
  <div class="card-body">
    {% if error %}<p style="color:var(--danger);">{{ error }}</p>{% endif %}
    <form method="post">
      <input type="hidden" name="csrf_token" value="{{ user.csrf_token }}">
      <div class="form-group"><label class="form-label">Имя</label><input class="input" name="name" required value="{{ form.name or '' }}"></div>
      <div class="form-group"><label class="form-label">Slug (a-z0-9-)</label><input class="input" name="slug" required pattern="[a-z0-9][a-z0-9-]{1,62}" value="{{ form.slug or '' }}"></div>
      <div class="form-group"><label class="form-label">Порт</label><input class="input" type="number" name="port" required min="{{ port_min }}" max="{{ port_max }}" value="{{ form.port or port_min }}"></div>
      <div class="form-group"><label class="form-label">Профиль БД</label>
        <select class="select" name="db_profile_id" required>
          {% for p in profiles %}
          <option value="{{ p.id }}" {% if form.db_profile_id==p.id %}selected{% endif %}>{{ p.name }}{% if p.disabled %} (отключён){% endif %}</option>
          {% endfor %}
        </select>
      </div>
      <div class="form-group"><label class="form-label">Git-ветка</label>
        <select class="select" name="git_branch" required>
          {% for b in branches %}
          <option {% if form.git_branch==b %}selected{% endif %}>{{ b }}</option>
          {% endfor %}
        </select>
      </div>
      <button class="button primary" type="submit">Создать</button>
    </form>
  </div>
</div>
{% endblock %}
