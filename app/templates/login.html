{% extends "base.html" %}
{% block title %}Вход — Test Stand Manager{% endblock %}
{% block content %}
<div class="card" style="max-width:420px;margin:80px auto;">
  <div class="card-header"><div class="card-title">Вход</div></div>
  <div class="card-body">
    {% if error %}<p style="color:var(--danger);">{{ error }}</p>{% endif %}
    <form method="post" action="/login">
      <div class="form-group">
        <label class="form-label">Пользователь</label>
        <input class="input" name="username" required autocomplete="username">
      </div>
      <div class="form-group">
        <label class="form-label">Пароль</label>
        <input class="input" type="password" name="password" required autocomplete="current-password">
      </div>
      <button class="button primary" type="submit">Войти</button>
    </form>
  </div>
</div>
{% endblock %}
