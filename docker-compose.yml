# Test Stand Manager — один сервис с Docker socket и метриками хоста через /host/proc.
#
#   cp config.example.yaml config.yaml
#   docker compose up -d --build

services:
  test-stand-manager:
    build: .
    image: grapes-test-stand-manager:latest
    container_name: grapes-test-stand-manager
    restart: unless-stopped
    environment:
      CONFIG_FILE: /config/config.yaml
    ports:
      - "8080:8080"
    volumes:
      - ./config.yaml:/config/config.yaml:ro
      - ./data:/data
      - /var/run/docker.sock:/var/run/docker.sock
      - /proc:/host/proc:ro
      - ${GIT_REPO_HOST_PATH:-/home/mavotronik/work/GrapesNTA}:${GIT_REPO_HOST_PATH:-/home/mavotronik/work/GrapesNTA}:ro
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/api/health').read()",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
